<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>International Payments Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue-25:#F7F9FF;--blue-50:#EEF1FF;--blue-100:#DAE1FF;--blue-200:#B5C4FF;--blue-400:#4D62ED;--blue-500:#2B3FC9;--blue-600:#001498;--blue-700:#001183;--blue-800:#000E6E;--blue-900:#000A52;
  --g0:#FFFFFF;--g50:#FAFAFA;--g100:#F4F6F9;--g200:#F0F0F0;--g300:#DBDFE9;--g400:#BDBDBD;--g500:#80868B;--g600:#6E6E7F;--g700:#4F4F4F;--g800:#2A2B2F;
  --red50:#FEF2F2;--red100:#FEE2E2;--red600:#CF0C0A;--green50:#F0FDF4;--green100:#DCFCE7;--green600:#16A34A;--yellow50:#FFFBEB;--yellow100:#FEF3C7;--yellow600:#D97706;--yellow700:#B45309;--info:#1A73E8;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-full:999px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(0,10,82,.14);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--g100);color:var(--g800);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-600);text-decoration:none}
.num{font-family:"Space Grotesk",Inter,sans-serif;font-feature-settings:"tnum"}
.ribbon{background:var(--blue-900);color:#fff;font-size:12px;text-align:center;padding:6px 16px}
.ribbon b{font-weight:600}
/* top bar */
.top{position:sticky;top:0;z-index:20;height:64px;background:#fff;border-bottom:1px solid var(--g300);display:flex;align-items:center;gap:16px;padding:0 24px}
.menu-btn{display:none;border:0;background:none;padding:8px;cursor:pointer;border-radius:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:24px;letter-spacing:-.5px;color:var(--g800)}
.brand .pill{font-size:10px;font-weight:700;letter-spacing:.6px;background:var(--blue-600);color:#fff;border-radius:var(--r-full);padding:3px 8px;text-transform:uppercase}
.top .spacer{flex:1}
.biz{display:flex;align-items:center;gap:8px;border:1px solid var(--g300);border-radius:var(--r-full);padding:6px 12px;font-weight:500}
.biz small{color:var(--g500);font-weight:400}
.icon-btn{position:relative;border:0;background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--g700)}
.icon-btn:hover{background:var(--g100)}
.badge-dot{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--red600);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;font-weight:700;font-size:13px}
.who{display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:var(--r-full);padding:4px 10px 4px 4px}
.who:hover{background:var(--g100)}
.who .meta{line-height:1.2}
.who .meta div:last-child{font-size:12px;color:var(--g500)}
/* layout */
.wrap{display:flex;min-height:calc(100vh - 94px)}
.side{width:248px;flex:none;background:#fff;border-right:1px solid var(--g300);padding:16px 12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.nav-group{font-size:11px;font-weight:600;color:var(--g500);letter-spacing:.6px;text-transform:uppercase;margin:16px 12px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);color:var(--g700);font-weight:500;margin-bottom:2px}
.nav a:hover{background:var(--g100)}
.nav a.active{background:var(--blue-50);color:var(--blue-600)}
.nav a .count{margin-left:auto;background:var(--blue-600);color:#fff;border-radius:var(--r-full);font-size:11px;font-weight:700;padding:1px 8px}
.nav a .new{margin-left:auto;background:var(--blue-600);color:#fff;border-radius:var(--r-full);font-size:10px;font-weight:700;padding:2px 7px;text-transform:uppercase;letter-spacing:.4px}
.nav a.sub{padding-left:42px;font-weight:400;font-size:13px}
.nav a .lock{margin-left:auto;color:var(--g400)}
.main{flex:1;min-width:0;padding:28px 32px 80px}
.page{max-width:1120px;margin:0 auto}
h1{font-size:24px;font-weight:700;margin:0 0 4px;letter-spacing:-.3px}
h2{font-size:18px;font-weight:600;margin:0 0 12px}
h3{font-size:15px;font-weight:600;margin:0 0 8px}
.sub-title{color:var(--g500);margin:0 0 24px}
.crumbs{font-size:13px;color:var(--g500);margin-bottom:8px}
.crumbs a{color:var(--g500)}
.crumbs a:hover{color:var(--blue-600)}
/* cards */
.card{background:#fff;border:1px solid var(--g300);border-radius:var(--r-md);padding:20px}
.card.flat{border:0;box-shadow:var(--shadow-sm)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:minmax(0,1fr) 340px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--g500)}
.small{font-size:12px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
hr.sep{border:0;border-top:1px solid var(--g200);margin:16px 0}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-sm);border:1px solid transparent;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn-primary{background:var(--blue-600);color:#fff}
.btn-primary:hover{background:var(--blue-700)}
.btn-primary:disabled{background:var(--g300);color:var(--g500);cursor:not-allowed}
.btn-secondary{background:var(--g100);color:var(--g800);border-color:var(--g300)}
.btn-secondary:hover{background:var(--g200)}
.btn-ghost{background:transparent;color:var(--blue-600)}
.btn-ghost:hover{background:var(--blue-50)}
.btn-danger{background:#fff;color:var(--red600);border-color:var(--red100)}
.btn-danger:hover{background:var(--red50)}
.btn-white{background:#fff;color:var(--blue-600)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-lg{height:48px;padding:0 20px;font-size:15px}
.btn-block{width:100%}
/* tags */
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-full);padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-blue{background:var(--blue-50);color:var(--blue-600)}
.t-green{background:var(--green50);color:var(--green600)}
.t-yellow{background:var(--yellow50);color:var(--yellow700)}
.t-red{background:var(--red50);color:var(--red600)}
.t-gray{background:var(--g100);color:var(--g600)}
/* tables */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--g500);padding:10px 12px;border-bottom:1px solid var(--g300);white-space:nowrap}
td{padding:14px 12px;border-bottom:1px solid var(--g200);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--blue-25)}
.table-wrap{overflow-x:auto}
/* forms */
label.f{display:block;font-weight:500;font-size:13px;margin-bottom:6px}
.input,select.input,textarea.input{width:100%;height:44px;border:1px solid var(--g300);border-radius:var(--r-sm);padding:0 12px;background:#fff;outline:none}
textarea.input{height:auto;padding:10px 12px;min-height:88px;resize:vertical}
.input:focus{border-color:var(--blue-600);box-shadow:0 0 0 3px var(--blue-100)}
.input.err{border-color:var(--red600)}
.help{font-size:12px;color:var(--g500);margin-top:6px}
.field{margin-bottom:16px}
.amount-box{display:flex;align-items:center;border:1px solid var(--g300);border-radius:var(--r-md);padding:0 16px;height:64px;background:#fff}
.amount-box:focus-within{border-color:var(--blue-600);box-shadow:0 0 0 3px var(--blue-100)}
.amount-box input{border:0;outline:none;flex:1;font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:26px;font-weight:600;min-width:0;background:transparent}
.amount-box .cur{font-weight:700;color:var(--g600);display:flex;align-items:center;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--blue-600)}
/* steps */
.steps{display:flex;gap:8px;margin-bottom:24px}
.step{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--g500);font-weight:500}
.step .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--g300);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:#fff}
.step.done .n{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.step.cur{color:var(--g800)}
.step.cur .n{border-color:var(--blue-600);color:var(--blue-600)}
.step .bar{flex:1;height:2px;background:var(--g300)}
.step.done .bar{background:var(--blue-600)}
/* summary list */
.kv{display:flex;justify-content:space-between;gap:16px;padding:8px 0}
.kv .k{color:var(--g500)}
.kv .v{font-weight:500;text-align:right}
.kv.total{border-top:1px solid var(--g300);margin-top:6px;padding-top:12px;font-weight:700}
.kv.total .k{color:var(--g800)}
/* alerts */
.alert{display:flex;gap:12px;border-radius:var(--r-md);padding:12px 14px;font-size:13px;align-items:flex-start}
.alert .ic{flex:none;margin-top:1px}
.a-info{background:var(--blue-50);color:var(--blue-900)}
.a-ok{background:var(--green50);color:#14532D}
.a-warn{background:var(--yellow50);color:#78350F}
.a-err{background:var(--red50);color:#7F1D1D}
.decision{border:1.5px dashed var(--yellow600);background:var(--yellow50);color:#78350F;border-radius:var(--r-md);padding:10px 12px;font-size:12px;margin:12px 0}
.decision b{color:var(--yellow700);text-transform:uppercase;letter-spacing:.4px;font-size:11px;margin-right:6px}
body.hide-dec .decision{display:none}
/* hero / promo */
.balance{background:var(--blue-600);color:#fff;border:0;position:relative;overflow:hidden}
.balance::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
.balance .lbl{opacity:.75;font-size:13px}
.balance .amt{font-size:36px;font-weight:700;margin:4px 0 18px}
.balance .btn-secondary{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)}
.balance .btn-secondary:hover{background:rgba(255,255,255,.2)}
.promo{background:linear-gradient(120deg,var(--blue-50),#fff 70%);border:1px solid var(--blue-100);display:flex;gap:20px;align-items:center}
.promo .art{width:96px;height:96px;flex:none;border-radius:var(--r-lg);background:var(--blue-600);display:grid;place-items:center;color:#fff}
.promo .facts{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 14px;font-size:13px}
.promo .facts span{display:flex;align-items:center;gap:6px}
.promo .x{align-self:flex-start;border:0;background:none;color:var(--g500);cursor:pointer;padding:4px}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--g200)}
.list-item:last-child{border-bottom:0}
.li-ic{width:40px;height:40px;border-radius:var(--r-sm);background:var(--g100);display:grid;place-items:center;flex:none;font-size:18px}
.li-main{flex:1;min-width:0}
.li-main .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-main .s{font-size:12px;color:var(--g500)}
.flag{font-size:20px;line-height:1}
/* choice cards */
.choice{border:1.5px solid var(--g300);border-radius:var(--r-md);padding:16px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s;text-align:left;width:100%}
.choice:hover{border-color:var(--blue-400)}
.choice.sel{border-color:var(--blue-600);background:var(--blue-25);box-shadow:0 0 0 3px var(--blue-100)}
.choice.disabled{opacity:.55;cursor:not-allowed}
.choice .t{font-weight:600}
.choice .s{font-size:12px;color:var(--g500)}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--g300);margin-bottom:20px}
.tabs a{padding:10px 14px;color:var(--g500);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.active{color:var(--blue-600);border-color:var(--blue-600)}
.tabs a .c{background:var(--g200);color:var(--g700);border-radius:var(--r-full);font-size:11px;padding:1px 7px;margin-left:6px}
/* timeline */
.tl{position:relative;padding-left:4px}
.tl-i{display:flex;gap:12px;position:relative;padding-bottom:18px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--g300)}
.tl-i:last-child::before{display:none}
.tl-i.done::before{background:var(--blue-600)}
.tl-dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--g300);background:#fff;font-size:11px;color:#fff;z-index:1}
.tl-i.done .tl-dot{background:var(--blue-600);border-color:var(--blue-600)}
.tl-i.cur .tl-dot{border-color:var(--blue-600);box-shadow:0 0 0 4px var(--blue-100)}
.tl-i.fail .tl-dot{background:var(--red600);border-color:var(--red600)}
.tl-i.warn .tl-dot{background:var(--yellow600);border-color:var(--yellow600)}
.tl-t{font-weight:600}
.tl-s{font-size:12px;color:var(--g500)}
/* misc */
.empty{text-align:center;padding:40px 20px;color:var(--g500)}
.doc{border:1px solid var(--g300);border-radius:var(--r-sm);background:var(--g50);padding:16px;font-size:12px}
.doc .line{height:8px;background:var(--g200);border-radius:4px;margin:6px 0}
.upload{border:1.5px dashed var(--g400);border-radius:var(--r-md);padding:18px;text-align:center;cursor:pointer;background:var(--g50);color:var(--g600)}
.upload:hover{border-color:var(--blue-600);color:var(--blue-600);background:var(--blue-25)}
.upload.done{border-style:solid;border-color:var(--green600);background:var(--green50);color:var(--green600);text-align:left;display:flex;align-items:center;gap:10px}
.countdown{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-weight:600}
.quote-live{border:1.5px solid var(--blue-600)}
.flags .alert{margin-bottom:8px}
.stat .k{font-size:12px;color:var(--g500)}
.stat .v{font-size:22px;font-weight:600;margin-top:2px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,10,82,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);width:100%;max-width:480px;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal.wide{max-width:640px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--g200)}
.modal-h h3{margin:0;font-size:16px}
.modal-b{padding:20px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--g200)}
.otp{display:flex;gap:8px;justify-content:center;margin:12px 0}
.otp input{width:44px;height:52px;text-align:center;font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:22px;font-weight:600;border:1px solid var(--g300);border-radius:var(--r-sm);outline:none}
.otp input:focus{border-color:var(--blue-600);box-shadow:0 0 0 3px var(--blue-100)}
/* dropdown */
.dd{position:absolute;right:16px;top:60px;width:380px;background:#fff;border:1px solid var(--g300);border-radius:var(--r-md);box-shadow:var(--shadow-lg);display:none;z-index:40}
.dd.open{display:block}
.dd-h{padding:14px 16px;font-weight:600;border-bottom:1px solid var(--g200);display:flex;justify-content:space-between}
.dd-i{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--g200);cursor:pointer}
.dd-i:hover{background:var(--blue-25)}
.dd-i.unread{background:var(--blue-25)}
.dd-i .dot{width:8px;height:8px;border-radius:50%;background:var(--blue-600);margin-top:6px;flex:none}
.dd-i .dot.read{background:transparent}
/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--g800);color:#fff;padding:12px 18px;border-radius:var(--r-sm);opacity:0;transition:.25s;z-index:60;font-weight:500}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* prototype panel */
.proto-btn{position:fixed;right:20px;bottom:20px;z-index:45;background:var(--g800);color:#fff;border:0;border-radius:var(--r-full);height:44px;padding:0 18px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px}
.proto{position:fixed;right:20px;bottom:76px;z-index:45;width:320px;background:#fff;border:1px solid var(--g300);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:16px;display:none}
.proto.open{display:block}
.proto h4{margin:0 0 4px;font-size:14px}
.seg{display:flex;background:var(--g100);border-radius:var(--r-sm);padding:3px;margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:7px 8px;font-weight:600;font-size:12px;cursor:pointer;color:var(--g600)}
.seg button.on{background:#fff;color:var(--blue-600);box-shadow:var(--shadow-sm)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.sw{position:relative;width:38px;height:22px;border-radius:11px;background:var(--g300);border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--blue-600)}
.sw.on::after{left:19px}
.scen{text-align:left}
.scen .t{font-weight:600;margin:8px 0 4px}
.scen p{margin:0 0 12px;color:var(--g500);font-size:13px}
.lock-page{max-width:520px;margin:60px auto;text-align:center}
.lock-page .ic{width:64px;height:64px;border-radius:50%;background:var(--g200);display:grid;place-items:center;margin:0 auto 16px;color:var(--g600)}
.intro-hero{background:var(--blue-600);color:#fff;border-radius:var(--r-lg);padding:36px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
.intro-hero h1{color:#fff;font-size:30px;margin-bottom:8px}
.intro-hero p{opacity:.85;margin:0 0 20px;font-size:15px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.how .n{width:32px;height:32px;border-radius:50%;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;font-weight:700;margin-bottom:10px}
.mini-cards{display:grid;gap:10px}
.mini{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:var(--r-md);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.advice{border:1px solid var(--g300);border-radius:var(--r-md);padding:24px}
.advice .head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--blue-600);padding-bottom:12px;margin-bottom:12px}
.email{border:1px solid var(--g300);border-radius:var(--r-md);overflow:hidden}
.email .eh{background:var(--g50);padding:12px 16px;font-size:12px;color:var(--g600);border-bottom:1px solid var(--g300)}
.email .eb{padding:24px}
@media (max-width:1100px){.g-main{grid-template-columns:1fr}.quote-live{order:-1;position:static!important}.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .side{position:fixed;left:0;top:64px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .menu-btn{display:block}
  .biz,.who .meta{display:none}
  .main{padding:20px 16px 80px}
  .g2,.g3,.g4,.how,.intro-hero{grid-template-columns:1fr}
  .steps .step span.lbl{display:none}
  .dd{right:8px;left:8px;width:auto}
  .promo{flex-direction:column;align-items:flex-start}
}

/* v2 additions */
.drawer-wrap{position:fixed;inset:0;background:rgba(0,10,82,.35);z-index:48;display:none}
.drawer-wrap.open{display:block}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:#fff;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--g200)}
.drawer-h h3{margin:0;font-size:16px}
.drawer-b{flex:1;overflow:auto;padding:20px}
.drawer-f{padding:16px 20px;border-top:1px solid var(--g200);background:#fff}
.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
.filters .input{height:40px}
@media (max-width:1100px){.filters{grid-template-columns:repeat(2,1fr)}}
.radio-row{display:flex;gap:20px;margin:4px 0 14px}
.radio-row label{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:500}
.radio-row input{width:18px;height:18px;accent-color:var(--blue-600)}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--g300);border-radius:var(--r-md);padding:14px;cursor:pointer;margin-bottom:10px;background:#fff}
.opt:hover{border-color:var(--blue-400)}
.opt.sel{border-color:var(--blue-600);background:var(--blue-25)}
.opt input{margin-top:3px;width:18px;height:18px;accent-color:var(--blue-600);flex:none}
.opt .t{font-weight:600}
.opt .s{font-size:12px;color:var(--g500)}
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.qa button{border:1px solid var(--g300);background:#fff;border-radius:var(--r-md);padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:13px;position:relative}
.qa button:hover{border-color:var(--blue-400);background:var(--blue-25)}
.qa .qi{width:40px;height:40px;border-radius:50%;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;font-size:18px}
.qa .nb{position:absolute;top:8px;right:8px;background:var(--blue-600);color:#fff;font-size:9px;font-weight:700;border-radius:var(--r-full);padding:2px 6px;letter-spacing:.4px}
.prod{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--g200)}
.prod:last-child{border-bottom:0}
.strip{display:flex;align-items:center;gap:16px;background:var(--blue-50);border:1px solid var(--blue-100);border-radius:var(--r-md);padding:14px 16px}
.strip .si{width:44px;height:44px;border-radius:var(--r-sm);background:var(--blue-600);color:#fff;display:grid;place-items:center;flex:none}
.calc{border:1px solid var(--g300);border-radius:var(--r-md);overflow:hidden}
.calc .cside{padding:14px 16px;background:#fff}
.calc .cside + .mid{border-top:1px solid var(--g200)}
.calc .mid{background:var(--g50);padding:10px 16px;font-size:13px;color:var(--g600);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--g200)}
.calc .lbl{font-size:12px;color:var(--g500);font-weight:500}
.calc .in{display:flex;align-items:center;gap:10px}
.calc input{border:0;outline:none;flex:1;min-width:0;font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:26px;font-weight:600;background:transparent;padding:4px 0}
.calc .cur{font-weight:700;color:var(--g600);display:flex;gap:8px;align-items:center}
.calc .cside:focus-within{background:var(--blue-25)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sec-h h3{margin:0}
.doc-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--g300);border-radius:var(--r-sm);padding:8px 10px;margin:4px 6px 4px 0;cursor:pointer;background:#fff;font-size:13px}
.doc-chip:hover{border-color:var(--blue-600);color:var(--blue-600)}
.rate-pill{display:inline-flex;align-items:center;gap:6px;background:var(--blue-50);color:var(--blue-600);border-radius:var(--r-full);padding:4px 10px;font-size:12px;font-weight:600}
.updated{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--yellow100)}100%{background:transparent}}
.warn-hero{max-width:560px;margin:30px auto;text-align:center}
.warn-hero .ic{width:64px;height:64px;border-radius:50%;background:var(--yellow50);color:var(--yellow600);display:grid;place-items:center;margin:0 auto 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.cc-btn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--g300);background:#fff;border-radius:var(--r-full);padding:8px 14px;cursor:pointer;font-weight:600}
.cc-btn.sel{border-color:var(--blue-600);background:var(--blue-25);color:var(--blue-600)}
.cc-btn.off{opacity:.5;cursor:not-allowed}
@media (max-width:860px){.qa{grid-template-columns:repeat(3,1fr)}}

function approvalItems(){
  const pays = S.payments.filter(p=>p.by==='maker'||p.approvedBy).filter(p=>!(p.status==='failed'&&p.fail==='notcompleted'&&!p.approvedBy)).map(p=>{
    const st = p.status==='awaiting'?'pending':['expired','rejected','withdrawn'].includes(p.status)?p.status:'approved';
    return {id:p.id,kind:'pay',type:'International payment',summary:`${money(total(p))} to ${ben(p.ben).nick}`,by:p.by,at:p.at,status:st,checker:st==='approved'||st==='rejected'?'admin':null,checkAt:p.approvedAt||p.failAt||'',remark:p.rejectReason||''};
  });
  const bens = [].filter(b=>b).map(b=>({id:'BN-'+b.id,kind:'ben',ref:b.id,type:'New beneficiary',summary:`${b.nick} · ${CORRIDORS[b.cc].name}`,by:b.addedBy,at:b.addedAt,status:b.status==='awaiting'?'pending':b.status==='declined'?'rejected':'approved',checker:b.status==='awaiting'?null:'admin',checkAt:b.approvedAt||''}));
  const other = S.otherApprovals.map(o=>({...o,kind:'other',status:o.status}));
  return [...pays,...bens,...other];
}

function submitDecision(id){
  const rm=$('#drm').value.trim(); S.dRemark=rm;
  const item=approvalItems().find(i=>i.id===id);
  if(S.dDecision==='r'){
    if(!rm){ $('#drm').classList.add('err'); toast('Add a reason to reject'); return; }
    if(item.kind==='pay'){ const p=pay(id); p.status='rejected'; p.rejectReason=rm; p.failAt=now(); notify(p.by,'Payment rejected',`Your Admin rejected ${p.id}: "${rm}"`,'#txn/'+p.id); }
    else if(item.kind==='ben'){ const b=ben(item.ref); b.status='declined'; b.rejectReason=rm; notify(b.addedBy,'Beneficiary not approved',`Your Admin didn't approve ${b.nick}: "${rm}"`,'#ben/'+b.id); }
    else { const o=S.otherApprovals.find(x=>x.id===id); o.status='rejected'; o.checker='admin'; o.checkAt=now(); }
    S.dRemark=''; closeDrawer(); render(); toast('Rejected'); return;
  }
  if(item.kind==='pay'){ const p=pay(id); if(total(p)>S.balance){ toast('Not enough balance'); return; } }

function timeline(p){
  const b=ben(p.ben); const T=[]; const add=(cls,t,s)=>T.push({cls,t,s});
  add('done','Initiated',`By ${USERS[p.by].name} · ${p.at}`);
  if(p.by!=='admin'||p.status==='awaiting'){
    if(p.status==='awaiting'){ add('cur','Submitted for Admin approval',`Expires ${p.expires}`); add('','Processing',''); add('','Money sent',''); add('','Completed',''); return T; }
    if(p.status==='expired'){ add('done','Submitted for Admin approval',''); add('fail','Expired','The request expired before it was approved. No money was taken.'); return T; }
    if(p.status==='rejected'){ add('done','Submitted for Admin approval',''); add('fail','Rejected by Admin',`"${p.rejectReason}". No money was taken.`); return T; }
    if(p.status==='withdrawn'){ add('done','Submitted for Admin approval',''); add('fail','Withdrawn','The request was withdrawn. No money was taken.'); return T; }
    add('done','Submitted for Admin approval',`Approved${p.approvedAt?' · '+p.approvedAt:''}`);
  }
  if(p.status==='processing'){ add('cur','Processing',`${money(total(p))} taken from your balance`); add('','Money sent',''); add('','Completed',''); return T; }
  add('done','Processing',`${money(total(p))} taken from your balance`);
  if(p.status==='pending_info'){ add('warn','Pending additional details',`Reply by ${p.infoDue}`); add('','Money sent',''); add('','Completed',''); return T; }
  if(p.status==='review'){ add('done','Pending additional details',`Details sent${p.infoSent?' · '+p.infoSent:''}`); add('cur','Under review','We\'ll update you once the review is complete.'); add('','Money sent',''); add('','Completed',''); return T; }
  if(p.fail==='notcompleted'){ add('fail','Failed',`We couldn't complete this payment. ${money(total(p))} was refunded to your balance · ${p.failAt}`); return T; }
  if(p.infoSent) add('done','Pending additional details','Details sent');
  if(p.status==='sent'){ add('done','Money sent',`Sent to ${b.bank}${p.sentAt?' · '+p.sentAt:''}`); add('cur','Completed',`Estimated delivery: ${etaOf(b)}`); return T; }
  add('done','Money sent',`Sent to ${b.bank}${p.sentAt?' · '+p.sentAt:''}`);
  add('done','Completed',`Paid to ${b.bank} · ${p.done}`);
  if(p.fail==='returned'){ add('fail','Failed',`Returned by the beneficiary's bank: ${p.returnReason}. ${money(total(p))} was refunded to your balance · ${p.failAt}`); }
  return T;
}

function pdfEsc(s){ return String(s).replace(/[^\x20-\x7E]/g,ch=>({'ü':'u','Ü':'U','•':'*','·':'-'}[ch]||'')).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
function buildPdf(ops){
  const content=ops.join('\n');
  const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>',
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'];
  let out='%PDF-1.4\n'; const offs=[];
  objs.forEach((o,i)=>{ offs.push(out.length); out+=`${i+1} 0 obj\n${o}\nendobj\n`; });
  const xref=out.length; out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  out+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return out;
}
